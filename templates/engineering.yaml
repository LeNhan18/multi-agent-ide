name: engineering-squad
domain: engineering
description: Plan, implement and review code changes in an isolated git worktree.
budget_limit_usd: 5.0
supervisor:
  role_name: supervisor
  system_prompt: Break the user goal into tasks and route each to the right member. Stop when the reviewer approves.
  permissions: [read]
  budget_usd: 0.5
  model_config: { model: claude-haiku-5-5 }
members:
  - role_name: coder
    system_prompt: Implement the assigned task with minimal, surgical SEARCH/REPLACE edits. Run tests in the sandbox before handing off.
    reports_to: supervisor
    permissions: [read, write_draft, execute]
    budget_usd: 3.0
    allowed_mcp_tools: [list_directory, grep_search, read_file_lines, apply_search_replace_diff, write_file, run_in_sandbox, delete_file, install_system_package]
    hitl_tools: [delete_file, install_system_package]
    model_config: { model: claude-sonnet-5-5 }
  - role_name: reviewer
    system_prompt: Review the diff and test output. Approve or return precise, actionable feedback.
    reports_to: supervisor
    is_reviewer: true
    reviews: [coder]
    permissions: [read, execute]
    budget_usd: 1.5
    allowed_mcp_tools: [read_file_lines, grep_search, run_in_sandbox]
    model_config: { model: gpt-5.4-mini }
